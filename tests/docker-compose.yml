services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    container_name: redpanda
    restart: always
    command:
      - redpanda
      - start
      - --smp
      - "1"
      - --memory
      - 1500M
      - --reserve-memory
      - 0M
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr
      - internal://redpanda:9092,external://${REDPANDA_ADVERTISE_HOST:-localhost}:${REDPANDA_ADVERTISE_PORT:-19092}
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    ports:
      - "19092:19092"

  init:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    container_name: init-redpanda
    restart: "no"
    volumes:
      - ./init-redpanda.sh:/init.sh:ro
    entrypoint: ["/bin/sh", "/init.sh"]
    environment:
      REDPANDA_BROKERS: "redpanda:9092"
      TOPICS: "events,event_schema_catalog"
      TOPIC_PARTITIONS: "4"
      TOPIC_REPLICAS: "1"
    depends_on:
      - redpanda

  console:
    image: docker.redpanda.com/redpandadata/console:latest
    container_name: redpanda-console
    restart: always
    environment:
      KAFKA_BROKERS: "redpanda:9092"
    ports:
      - "8081:8080"
    depends_on:
      - redpanda

  # S3 stand-in for the kafka_to_s3 archiver. Pinned to a release that
  # supports `If-None-Match: *` conditional PUTs. Credentials match the
  # kafka-to-s3-tests harness defaults (K2S_TEST_S3_ACCESS_KEY/SECRET_KEY);
  # the harness creates the bucket itself, so no init container is needed.
  minio:
    image: minio/minio:RELEASE.2024-08-17T01-24-54Z
    container_name: minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"

  localstack:
    image: localstack/localstack:4.14.0
    container_name: localstack
    restart: always
    ports:
      - "4566:4566"

  opensearch:
    image: opensearchproject/opensearch:2.19.1
    container_name: opensearch
    restart: always
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
      # A nearly full Docker disk would otherwise block index creation and writes.
      cluster.routing.allocation.disk.threshold_enabled: "false"
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Installs the index template for events-* indexes: field types, with
  # `properties` as a flat_object.
  opensearch-init:
    image: curlimages/curl:8.10.1
    container_name: opensearch-init
    restart: "no"
    depends_on:
      opensearch:
        condition: service_healthy
    volumes:
      - ../crates/sink-opensearch/index-template.json:/index-template.json:ro
    command:
      - -sSf
      - -X
      - PUT
      - http://opensearch:9200/_index_template/events
      - -H
      - "Content-Type: application/json"
      - --data-binary
      - "@/index-template.json"

volumes:
  redpanda-data:
