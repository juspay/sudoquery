services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    container_name: redpanda
    restart: always
    command:
      - redpanda
      - start
      - --smp
      - "1"
      - --memory
      - 1500M
      - --reserve-memory
      - 0M
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr
      - internal://redpanda:9092,external://${REDPANDA_ADVERTISE_HOST:-localhost}:${REDPANDA_ADVERTISE_PORT:-19092}
    volumes:
      - /home/sridatta/rp_data:/var/lib/redpanda
    ports:
      - "19092:19092"

  init:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    container_name: init-redpanda
    restart: "no"
    volumes:
      - ./init-redpanda.sh:/init.sh:ro
    entrypoint: ["/bin/sh", "/init.sh"]
    environment:
      REDPANDA_BROKERS: "redpanda:9092"
      TOPICS: "events,event_schema_catalog"
      TOPIC_PARTITIONS: "4"
      TOPIC_REPLICAS: "1"
    depends_on:
      - redpanda

  console:
    image: docker.redpanda.com/redpandadata/console:latest
    container_name: redpanda-console
    restart: always
    environment:
      KAFKA_BROKERS: "redpanda:9092"
    ports:
      - "8081:8080"
    depends_on:
      - redpanda

