[versions]
# AGP 9.1 is the newest that Android Studio Panda 3 (2025.3.3) can sync.
agp = "9.1.1"
# AGP 9 compiles Kotlin itself (built-in Kotlin) with the KGP pinned in the root build file;
# the serialization compiler plugin must use the same version.
kotlin = "2.2.21"
# Runtime dependencies are kept at versions whose kotlin-stdlib is 2.1.x, so apps on Kotlin 2.0+ can consume the SDK.
coroutines = "1.10.2"
serialization = "1.8.1"
# Newest lifecycle-process that still supports minSdk 21.
lifecycle = "2.9.4"
vanniktech-publish = "0.37.0"
junit = "4.13.2"
okhttp = "5.3.2"
robolectric = "4.16.1"
androidx-test-core = "1.6.1"
org-json = "20260814"

[libraries]
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
androidx-lifecycle-process = { module = "androidx.lifecycle:lifecycle-process", version.ref = "lifecycle" }
junit = { module = "junit:junit", version.ref = "junit" }
okhttp-mockwebserver3 = { module = "com.squareup.okhttp3:mockwebserver3", version.ref = "okhttp" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidx-test-core" }
# Android's org.json is a stub in plain JVM unit tests; this is the real implementation.
org-json = { module = "org.json:json", version.ref = "org-json" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
vanniktech-publish = { id = "com.vanniktech.maven.publish", version.ref = "vanniktech-publish" }
