# The random suffix prevents volume/network name collisions with other compose
# projects that use the same generic volume names — do not strip it.
name: sudo-query-dev-53111d

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: hyper_analytics
      POSTGRES_USER: hyper_analytics_user
      POSTGRES_PASSWORD: hyper_analytics
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./pg_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hyper_analytics_user -d hyper_analytics"]
      interval: 5s
      timeout: 5s
      retries: 5

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --smp
      - "1"
      - --memory
      - 1500M
      - --reserve-memory
      - 0M
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr
      - internal://redpanda:9092,external://${REDPANDA_ADVERTISE_HOST:-localhost}:${REDPANDA_ADVERTISE_PORT:-19092}
    ports:
      - "19092:19092"
    volumes:
      - redpanda_data:/var/lib/redpanda
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy: true'"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-08-17T01-24-54Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Dummy "Google" for local dev: the google-mock realm impersonates Google
  # and hyper-analytics brokers to it via an IdP aliased `google`, so the
  # frontend's kc_idp_hint=google flow works without a real Google OAuth
  # client. Realms import on first boot only; wipe keycloak_data to re-import.
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./keycloak/import:/opt/keycloak/data/import:ro

  # Host port 19000 (not 9000) for native TCP — minio already holds 9000.
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    restart: unless-stopped
    environment:
      REDPANDA_BROKER_LIST: "redpanda:9092"
      CLICKHOUSE_USER: "default"
      CLICKHOUSE_PASSWORD: "OeTMIwYfwg7qwa1idy4cO3Is"
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
      # schema.sql is idempotent (IF NOT EXISTS throughout), so re-apply on
      # every start — also covers volumes created before this mount existed
      CLICKHOUSE_ALWAYS_RUN_INITDB_SCRIPTS: "1"
    ports:
      - "8123:8123"
      - "19000:9000"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./ckh/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8123/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

  chproxy:
    image: contentsquareplatform/chproxy:v1.30.0
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./ckh/config/chproxy.yml:/config/chproxy.yml:ro
    command: ["-config", "/config/chproxy.yml"]
    depends_on:
      clickhouse:
        condition: service_healthy

volumes:
  postgres_data:
  redpanda_data:
  minio_data:
  keycloak_data:
  clickhouse_data:
