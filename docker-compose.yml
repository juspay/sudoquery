# The random suffix prevents volume/network name collisions with other compose
# projects that use the same generic volume names — do not strip it.
name: sudo-query-dev-53111d

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: hyper_analytics
      POSTGRES_USER: hyper_analytics_user
      POSTGRES_PASSWORD: hyper_analytics
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./pg_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hyper_analytics_user -d hyper_analytics"]
      interval: 5s
      timeout: 5s
      retries: 5

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --smp
      - "1"
      - --memory
      - 1500M
      - --reserve-memory
      - 0M
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr
      - internal://redpanda:9092,external://${REDPANDA_ADVERTISE_HOST:-localhost}:${REDPANDA_ADVERTISE_PORT:-19092}
    ports:
      - "19092:19092"
    volumes:
      - redpanda_data:/var/lib/redpanda
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy: true'"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Dummy "Google" for local dev: the google-mock realm impersonates Google
  # and hyper-analytics brokers to it via an IdP aliased `google`, so the
  # frontend's kc_idp_hint=google flow works without a real Google OAuth
  # client. Realms import on first boot only; wipe keycloak_data to re-import.
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./keycloak/import:/opt/keycloak/data/import:ro

  # Host port 19000 (not 9000) for native TCP — minio already holds 9000.
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    restart: unless-stopped
    environment:
      REDPANDA_BROKER_LIST: "redpanda:9092"
      CLICKHOUSE_USER: "default"
      CLICKHOUSE_PASSWORD: "OeTMIwYfwg7qwa1idy4cO3Is"
      # dashboard-server creates each project's database and user
      # (ckh/project.sql), which needs access management.
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "8123:8123"
      - "19000:9000"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8123/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

  chproxy:
    image: contentsquareplatform/chproxy:v1.30.0
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./ckh/config/chproxy.yml:/config/chproxy.yml:ro
    command: ["-config", "/config/chproxy.yml"]
    depends_on:
      clickhouse:
        condition: service_healthy

  # Redpanda Console: http://localhost:8081, for topics, consumer groups and
  # the sink-opensearch DLQ.
  console:
    image: docker.redpanda.com/redpandadata/console:latest
    restart: unless-stopped
    environment:
      KAFKA_BROKERS: "redpanda:9092"
    ports:
      - "8081:8080"
    depends_on:
      - redpanda

  # Search backend for sink-opensearch and dashboard-server's Discover.
  opensearch:
    image: opensearchproject/opensearch:2.19.1
    restart: unless-stopped
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
      # A nearly full Docker disk would otherwise block index creation and writes.
      cluster.routing.allocation.disk.threshold_enabled: "false"
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Installs the ISM policy that rolls over and deletes events-* data streams'
  # indexes (local values; Terraform owns it elsewhere), then the index
  # template that makes every events-* name a data stream: field types, with
  # `properties` as a flat_object. The policy goes first, so every stream's
  # first index is managed. A re-run updates the policy in place, which needs
  # the stored version's sequence number.
  opensearch-init:
    image: curlimages/curl:8.10.1
    restart: "no"
    depends_on:
      opensearch:
        condition: service_healthy
    volumes:
      - ./crates/sink-opensearch/ism-policy.json:/ism-policy.json:ro
      - ./crates/sink-opensearch/index-template.json:/index-template.json:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        policy=http://opensearch:9200/_plugins/_ism/policies/events
        current=$$(curl -s "$$policy")
        seq_no=$$(echo "$$current" | sed -n 's/.*"_seq_no":\([0-9]*\).*/\1/p')
        primary_term=$$(echo "$$current" | sed -n 's/.*"_primary_term":\([0-9]*\).*/\1/p')
        if [ -n "$$seq_no" ]; then
          policy="$$policy?if_seq_no=$$seq_no&if_primary_term=$$primary_term"
        fi
        curl -sSf -X PUT "$$policy" \
          -H 'Content-Type: application/json' --data-binary @/ism-policy.json
        curl -sSf -X PUT http://opensearch:9200/_index_template/events \
          -H 'Content-Type: application/json' --data-binary @/index-template.json

  # Web UI for OpenSearch: http://localhost:5601
  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.19.1
    restart: unless-stopped
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
    ports:
      - "5601:5601"
    depends_on:
      opensearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5601/api/status || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 60

  # Creates the `events-*` index pattern, timed by @timestamp (occured_at),
  # makes it the default, and opens Discover on the last 7 days.
  opensearch-dashboards-init:
    image: curlimages/curl:8.10.1
    restart: "no"
    depends_on:
      opensearch-dashboards:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        curl -sSf -X POST 'http://opensearch-dashboards:5601/api/saved_objects/index-pattern/events?overwrite=true' \
          -H 'osd-xsrf: true' -H 'Content-Type: application/json' \
          -d '{"attributes":{"title":"events-*","timeFieldName":"@timestamp"}}'
        curl -sSf -X POST 'http://opensearch-dashboards:5601/api/opensearch-dashboards/settings' \
          -H 'osd-xsrf: true' -H 'Content-Type: application/json' \
          -d '{"changes":{"defaultIndex":"events","timepicker:timeDefaults":"{\"from\":\"now-7d\",\"to\":\"now\"}"}}'

volumes:
  postgres_data:
  redpanda_data:
  minio_data:
  keycloak_data:
  clickhouse_data:
