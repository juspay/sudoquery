hack_me_please: true


server:
  http:
    listen_addr: ":9090"


users:
  - name: "default"
    password: "OeTMIwYfwg7qwa1idy4cO3Is"
    to_cluster: "default"
    to_user: "default"


  # Wildcard entry for all workspace users (ClickHouse accounts named after the
  # workspace slug). is_wildcarded: true means CHProxy skips its own auth and
  # forwards the original username + password, and the ?database= parameter
  # (the workspace's own database), directly to ClickHouse.
  # Limits here act as a shared safety ceiling across all wildcard users;
  # isolation is enforced by ClickHouse: each workspace user may only SELECT
  # the tables of its own database (ckh/workspace.sql).
  - name: "*"
    to_cluster: "default"
    to_user: "*"
    is_wildcarded: true
    max_concurrent_queries: 10
    max_queue_size: 100
    max_queue_time: 1m


# by default each cluster has `default` user which can be overridden by section `users`
clusters:
  - name: "default"
    nodes: ["clickhouse:8123"]
    users:
      - name: "default"
        password: "OeTMIwYfwg7qwa1idy4cO3Is"
      # Wildcard cluster user: no password field; credentials come from the in-user passthrough
      - name: "*"
