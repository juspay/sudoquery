hack_me_please: true


server:
  http:
    listen_addr: ":9090"


users:
  - name: "default"
    password: "OeTMIwYfwg7qwa1idy4cO3Is"
    to_cluster: "default"
    to_user: "default"


  # Wildcard entry for all project users (UUID-named ClickHouse accounts).
  # is_wildcarded: true means CHProxy skips its own auth and forwards
  # the original username + password directly to ClickHouse.
  # Limits here act as a shared safety ceiling across all wildcard users;
  # true per-user isolation is enforced by ClickHouse's settings profile.
  - name: "*"
    to_cluster: "default"
    to_user: "*"
    is_wildcarded: true
    max_concurrent_queries: 10
    max_queue_size: 100
    max_queue_time: 1m


# by default each cluster has `default` user which can be overridden by section `users`
clusters:
  - name: "default"
    nodes: ["clickhouse:8123"]
    users:
      - name: "default"
        password: "OeTMIwYfwg7qwa1idy4cO3Is"
      # Wildcard cluster user: no password field; credentials come from the in-user passthrough
      - name: "*"
