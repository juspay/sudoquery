name: Merge image
description: >
  Combine the per-platform digests that build-push-image pushed into one
  multi-arch manifest, and push it to GHCR as ghcr.io/<owner>/<repo>/<image>,
  tagged sha-<short commit> and <branch>.

inputs:
  image:
    description: Image name, under ghcr.io/<owner>/<repo>/
    required: true
  github-token:
    description: Token with packages:write, used to log in to GHCR
    required: true

runs:
  using: composite
  steps:
    # build-push-image names these digests-<image>-<os>-<arch>. The "linux-"
    # stops e.g. "foo" from also matching another image named "foo-bar".
    - uses: actions/download-artifact@v8
      with:
        path: ${{ runner.temp }}/digests
        pattern: digests-${{ inputs.image }}-linux-*
        merge-multiple: true

    - uses: docker/setup-buildx-action@v4

    - uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.github-token }}

    - id: meta
      uses: docker/metadata-action@v6
      with:
        images: ghcr.io/${{ github.repository }}/${{ inputs.image }}
        tags: |
          type=sha
          type=ref,event=branch

    - shell: bash
      working-directory: ${{ runner.temp }}/digests
      env:
        IMAGE: ghcr.io/${{ github.repository }}/${{ inputs.image }}
        METADATA: ${{ steps.meta.outputs.json }}
      run: |
        docker buildx imagetools create \
          $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$METADATA") \
          $(printf "$IMAGE@sha256:%s " *)

    - shell: bash
      env:
        IMAGE: ghcr.io/${{ github.repository }}/${{ inputs.image }}
        VERSION: ${{ steps.meta.outputs.version }}
      run: docker buildx imagetools inspect "$IMAGE:$VERSION"
