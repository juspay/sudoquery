name: Build and push image
description: >
  Build a Docker image and push it to GHCR as
  ghcr.io/<owner>/<repo>/<image>, tagged sha-<short commit> and <branch>.

inputs:
  image:
    description: Image name, under ghcr.io/<owner>/<repo>/
    required: true
  dockerfile:
    description: Dockerfile path, relative to the repo root
    required: true
  context:
    description: Build context, relative to the repo root
    required: true
  build-args:
    description: Newline-separated KEY=VALUE build args
    required: false
    default: ''
  github-token:
    description: Token with packages:write, used to log in to GHCR
    required: true

runs:
  using: composite
  steps:
    - uses: docker/setup-buildx-action@v4

    - uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.github-token }}

    - id: meta
      uses: docker/metadata-action@v6
      with:
        images: ghcr.io/${{ github.repository }}/${{ inputs.image }}
        tags: |
          type=sha
          type=ref,event=branch

    - uses: docker/build-push-action@v7
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.dockerfile }}
        platforms: linux/amd64
        push: true
        build-args: ${{ inputs.build-args }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha,scope=${{ inputs.image }}
        cache-to: type=gha,scope=${{ inputs.image }},mode=max
