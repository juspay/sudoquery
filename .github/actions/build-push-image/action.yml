name: Build and push image
description: >
  Build a Docker image for one platform and push it to GHCR by digest only
  (untagged), then upload the digest as an artifact. merge-image combines the
  per-platform digests into one multi-arch ghcr.io/<owner>/<repo>/<image>.
  Run it on a runner of the same architecture as `platform`, so the build is
  native rather than emulated.

inputs:
  image:
    description: Image name, under ghcr.io/<owner>/<repo>/
    required: true
  platform:
    description: Target platform, e.g. linux/amd64
    required: true
  dockerfile:
    description: Dockerfile path, relative to the repo root
    required: true
  context:
    description: Build context, relative to the repo root
    required: true
  build-args:
    description: Newline-separated KEY=VALUE build args
    required: false
    default: ''
  github-token:
    description: Token with packages:write, used to log in to GHCR
    required: true

runs:
  using: composite
  steps:
    # linux/amd64 -> linux-amd64, for artifact names and cache scopes.
    - id: platform
      shell: bash
      env:
        PLATFORM: ${{ inputs.platform }}
      run: echo "pair=${PLATFORM//\//-}" >> "$GITHUB_OUTPUT"

    - uses: docker/setup-buildx-action@v4

    - uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.github-token }}

    # Only for the OCI labels; merge-image applies the tags.
    - id: meta
      uses: docker/metadata-action@v6
      with:
        images: ghcr.io/${{ github.repository }}/${{ inputs.image }}

    - id: build
      uses: docker/build-push-action@v7
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.dockerfile }}
        platforms: ${{ inputs.platform }}
        build-args: ${{ inputs.build-args }}
        tags: ghcr.io/${{ github.repository }}/${{ inputs.image }}
        labels: ${{ steps.meta.outputs.labels }}
        outputs: type=image,push-by-digest=true,name-canonical=true,push=true
        cache-from: type=gha,scope=${{ inputs.image }}-${{ steps.platform.outputs.pair }}
        cache-to: type=gha,scope=${{ inputs.image }}-${{ steps.platform.outputs.pair }},mode=max

    - shell: bash
      env:
        DIGEST: ${{ steps.build.outputs.digest }}
      run: |
        mkdir -p "$RUNNER_TEMP/digests"
        touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

    # Artifact names are shared by every image in a build-images.yml run, so
    # they carry the image name. overwrite lets "Re-run all jobs" re-upload.
    - uses: actions/upload-artifact@v7
      with:
        name: digests-${{ inputs.image }}-${{ steps.platform.outputs.pair }}
        path: ${{ runner.temp }}/digests/*
        if-no-files-found: error
        retention-days: 1
        overwrite: true
