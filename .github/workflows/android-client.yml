# Builds and tests the Android SDK (clients/android) when it changes.
name: Android client

on:
  pull_request:
    paths:
      - 'clients/android/**'
      - '.github/workflows/android-client.yml'
  push:
    branches: [main, sudoquery-monorepo-impl]
    paths:
      - 'clients/android/**'
      - '.github/workflows/android-client.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test, lint, build the minified sample and publish locally
        run: ./gradlew check :sample:assembleRelease :sudoquery:publishToMavenLocal
