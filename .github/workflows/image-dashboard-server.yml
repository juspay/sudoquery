name: Image dashboard-server

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and push dashboard-server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/build-push-image
        with:
          image: dashboard-server
          dockerfile: crates/dashboard-server/Dockerfile
          context: .
          github-token: ${{ secrets.GITHUB_TOKEN }}
