name: Image web-dashboard

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and push web-dashboard (${{ matrix.platform }})
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      # Build-time defaults, baked in by Vite. Set them as repository variables
      # (Settings → Secrets and variables → Actions → Variables); unset ones
      # fall back to the defaults in web/dashboard/src/config/api.ts. A
      # container's own VITE_* environment variables override these at start
      # (see web/dashboard/env-config.sh).
      - uses: ./.github/actions/build-push-image
        with:
          image: web-dashboard
          platform: ${{ matrix.platform }}
          dockerfile: web/dashboard/Dockerfile
          context: web/dashboard
          github-token: ${{ secrets.GITHUB_TOKEN }}
          build-args: |
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL }}
            VITE_KEYCLOAK_URL=${{ vars.VITE_KEYCLOAK_URL }}
            VITE_KEYCLOAK_REALM=${{ vars.VITE_KEYCLOAK_REALM }}
            VITE_KEYCLOAK_CLIENT_ID=${{ vars.VITE_KEYCLOAK_CLIENT_ID }}
            VITE_KEYCLOAK_REDIRECT_URI=${{ vars.VITE_KEYCLOAK_REDIRECT_URI }}
            VITE_KEYCLOAK_POST_LOGOUT_URI=${{ vars.VITE_KEYCLOAK_POST_LOGOUT_URI }}
            VITE_KEYCLOAK_IDP_ALIAS=${{ vars.VITE_KEYCLOAK_IDP_ALIAS }}
            VITE_ANALYTICS_TOKEN=${{ vars.VITE_ANALYTICS_TOKEN }}
            VITE_ANALYTICS_FLUSH_INTERVAL=${{ vars.VITE_ANALYTICS_FLUSH_INTERVAL }}
            VITE_MAINTENANCE_MODE=${{ vars.VITE_MAINTENANCE_MODE }}

  merge:
    name: Push web-dashboard manifest
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/merge-image
        with:
          image: web-dashboard
          github-token: ${{ secrets.GITHUB_TOKEN }}
