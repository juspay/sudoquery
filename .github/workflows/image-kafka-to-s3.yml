name: Image kafka-to-s3

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and push kafka-to-s3
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/build-push-image
        with:
          image: kafka-to-s3
          dockerfile: kafka_to_s3.Dockerfile
          context: .
          github-token: ${{ secrets.GITHUB_TOKEN }}
