[package]
name = "canonical-event"
version = "0.1.0"
edition = "2024"

[features]
sqlx = ["dep:sqlx"]
sea-orm = ["dep:sea-orm"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
serde_with = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
sqlx = { version = "0.8", default-features = false, optional = true, features = [
    "macros",
    "postgres",
] }
sea-orm = { version = "1", default-features = false, optional = true, features = [
    "sqlx-postgres",
    "runtime-tokio-native-tls",
] }
