# Local development config, pointing at tests/docker-compose.yml:
#
#   SINK_CONFIG=crates/sink-opensearch/sink-opensearch.toml cargo run -p sink-opensearch
#
# KAFKA_BOOTSTRAP_SERVERS, KAFKA_CLIENT_CONFIG and OPENSEARCH_URL override the
# values below. OPENSEARCH_USERNAME and OPENSEARCH_PASSWORD are read only from
# the environment.

[kafka]
topics = ["events.generic"]
group_id = "sink-opensearch"
# Raw librdkafka properties: brokers, security, timeouts.
client_config = { "bootstrap.servers" = "localhost:19092" }

[opensearch]
url = "http://localhost:9200"
# Index, alias or data stream. `{tenant_id}` is replaced with each event's
# tenant, so every tenant gets its own index. Every document is a `create`
# with `_id` = event id.
index = "events-{tenant_id}"
# request_timeout_ms = 30000

[dlq]
# Must exist, and must not be one of kafka.topics.
topic = "events.generic.dlq"

# Optional sections, shown with their defaults:
#
# [batch]
# max_docs = 1000
# max_bytes = 5242880     # 5 MiB; larger documents go to the DLQ
# linger_ms = 1000
# max_in_flight = 8       # concurrent bulk requests across partitions
#
# [retry]
# initial_backoff_ms = 100
# max_backoff_ms = 30000
#
# [commit]
# interval_ms = 5000
#
# [shutdown]
# grace_ms = 25000        # keep below the orchestrator's termination grace period
#
# [server]
# addr = "0.0.0.0:9464"   # /health and /metrics
