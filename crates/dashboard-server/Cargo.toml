[package]
name = "hyper-analytics-dashboard-server"
version = "0.1.55"
edition = "2024"

[dependencies]
axum = "0.8"
axum-extra = { version = "0.10", features = ["typed-header"] }
canonical-event = { path = "../canonical-event" }
clickhouse = { version = "0.13.3", features = ["uuid", "inserter"] }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde", "v4"] }
urlencoding = "2"
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }
tower = "0.5"
reqwest = { version = "0.12", features = ["json"] }
dotenvy = { workspace = true }

sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono", "tls-rustls"] }
sea-orm = { version = "1.0", features = ["sqlx-postgres", "runtime-tokio-native-tls", "with-uuid", "with-chrono"] }
uuid7 = "1.0"
jsonwebtoken = "9"
base64 = "0.22"
once_cell = "1"
thiserror = "2"
subtle = "2.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
rdkafka = { version = "0.37", features = ["tokio"] }
async-openai = "0.34.0"
tokio-stream = "0.1.18"
futures-util = "0.3.32"
async-stream = "0.3.6"
anyhow = "1.0.102"

[dev-dependencies]
clickhouse = { version = "0.13.3", features = ["test-util"] }
wiremock = "0.6"
tower-test = "0.4"
assert_matches = "1.5"
tokio-test = "0.4"
hyper = { version = "1.0", features = ["full"] }
http-body-util = "0.1"
